<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">图片占位图</title>
  <desc id="desc">蓝灰色抽象电路板插图，用于文章图片占位</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#dfe8f2"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8fba"/>
      <stop offset="1" stop-color="#9cb2cd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".7">
    <path d="M90 170h185l64 64h125"/>
    <path d="M1110 130H930l-65 65H735"/>
    <path d="M95 520h175l74-74h125"/>
    <path d="M1100 550H925l-50-50H740"/>
    <path d="M205 75v150l55 55"/>
    <path d="M995 605V465l-55-55"/>
  </g>
  <g fill="#6f8fba" opacity=".78">
    <circle cx="90" cy="170" r="13"/><circle cx="1110" cy="130" r="13"/>
    <circle cx="95" cy="520" r="13"/><circle cx="1100" cy="550" r="13"/>
    <circle cx="205" cy="75" r="13"/><circle cx="995" cy="605" r="13"/>
  </g>
  <rect x="365" y="190" width="470" height="280" rx="66" fill="rgba(255,255,255,.78)" stroke="#6f8fba" stroke-width="10"/>
  <rect x="415" y="240" width="370" height="180" rx="34" fill="none" stroke="#8fa8c8" stroke-width="5" opacity=".6"/>
  <path d="M500 405l90-92 72 68 62-55 76 79H500z" fill="#8fa8c8" opacity=".7"/>
  <circle cx="665" cy="285" r="25" fill="#6f8fba" opacity=".68"/>
  <text x="600" y="565" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" letter-spacing="4" fill="#5478a9">图片占位示例</text>
</svg>