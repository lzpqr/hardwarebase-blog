<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">硬件Base 头像</title>
  <desc id="desc">深蓝色电路板风格头像，中央为 HB 字母标识</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182433"/>
      <stop offset="1" stop-color="#2e4663"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa8c8"/>
      <stop offset="1" stop-color="#6f8fba"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa8c8"/>
      <stop offset="1" stop-color="#5478a9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="none" stroke="url(#trace)" stroke-width="9" stroke-linecap="round" opacity=".74">
    <path d="M65 128h78l30 30h52"/>
    <path d="M447 112h-76l-36 36h-65"/>
    <path d="M70 382h86l36-36h52"/>
    <path d="M443 397h-83l-28-28"/>
    <path d="M112 64v63l26 26"/>
    <path d="M400 448v-69l-25-25"/>
  </g>
  <g fill="#8fa8c8" opacity=".82">
    <circle cx="65" cy="128" r="8"/><circle cx="447" cy="112" r="8"/>
    <circle cx="70" cy="382" r="8"/><circle cx="443" cy="397" r="8"/>
    <circle cx="112" cy="64" r="8"/><circle cx="400" cy="448" r="8"/>
  </g>
  <rect x="130" y="130" width="252" height="252" rx="56" fill="#111b27" stroke="#6f8fba" stroke-width="8" filter="url(#glow)" opacity=".96"/>
  <rect x="154" y="154" width="204" height="204" rx="38" fill="none" stroke="#8fa8c8" stroke-width="4" opacity=".34"/>
  <text x="256" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="700" letter-spacing="4" fill="url(#core)">HB</text>
  <path d="M196 355h120" stroke="#6f8fba" stroke-width="6" stroke-linecap="round" opacity=".62"/>
</svg>