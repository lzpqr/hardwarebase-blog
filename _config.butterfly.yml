# Butterfly 主题配置覆盖
# 未在此处列出的选项由 hexo-theme-butterfly 的默认配置接管。
# 完整配置示例：node_modules/hexo-theme-butterfly/_config.yml

nav:
  logo: /img/favicon.svg
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  选型系列: /collections/component-selection/ || fas fa-layer-group
  流程系列: /collections/hardware-development/ || fas fa-list-check
  接口协议: /collections/hardware-interface-protocol/ || fas fa-network-wired
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

code_blocks:
  theme: light
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fas fa-envelope: mailto:lzp0525@126.com || Email || '#4a7dbe'

favicon: /img/favicon.svg

avatar:
  img: /img/avatar.svg
  effect: false

disable_top_img: true

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover: /img/og-cover.png

error_404:
  enable: true
  subtitle: '页面走丢了'
  background: /img/error-page.png

subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 记录，思考，应用

index_layout: 4

index_post_content:
  method: 1
  length: 180

toc:
  post: true
  number: true
  expand: false
  scroll_percent: true

post_copyright:
  enable: true
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 3

post_pagination: 1

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text:

aside:
  enable: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: '记录，思考，应用。'
    button:
      enable: false
  card_announcement:
    enable: true
    content: '欢迎来到硬件Base，这里记录技术、硬件与长期思考。'
  card_recent_post:
    enable: false
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 12
    color: false
  card_archives:
    enable: false
    type: monthly
    format: 'YYYY年MM月'
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2026/10/01

rightside_scroll_percent: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

math:
  use: mathjax
  per_page: false
  hide_scrollbar: false

search:
  use: local_search
  placeholder: '搜索文章…'
  local_search:
    preload: true
    top_n_per_article: -1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

share:
  use:

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

waline:
  # 接入 Waline 后，在这里填写服务端地址，并把上面的 comments.use 改为 Waline。
  serverURL:
  bg:
  pageview: false
  option:

display_mode: light
text_align_justify: false

font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
  code_font_family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace'

blog_title_font:
  font_link:
  font_family: '"Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif'

preloader:
  enable: false

canvas_ribbon:
  enable: false

theme_color:
  enable: true
  main: '#6F8FBA'
  paginator: '#6F8FBA'
  link_color: '#5478A9'
  hr_color: '#8FA8C8'
  code_foreground: '#B85C6A'
  code_background: 'rgba(111, 143, 186, 0.08)'
  toc_color: '#6F8FBA'
  meta_color: '#7A8493'
  blockquote_padding_color: '#6F8FBA'
  blockquote_background_color: '#6F8FBA'

CDN:
  internal_provider: local
  third_party_provider: local
  option:
    fontawesome: /vendor/fontawesome/css/all.min.css
    mathjax: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js

Open_Graph_meta:
  enable: true
  option:
    image: /img/og-cover.png

inject:
  head:
    # custom.css 已合并进 css/index.min.css（source/css/custom.css 被主题 index.styl @import）,
    # 不再单独请求，避免浏览器多下载 6KB 并覆盖压缩版样式。
  bottom:
    - |
      <script>
      // Homepage-only, idempotent custom content:
      //   hb-hero    - hero card ("硬件基础知识库")
      //   hb-cat-grid - "分类索引" card: top 5 posts per category, titles only
      document.addEventListener('DOMContentLoaded', function () {
        var isHome = window.location.pathname === '/' || window.location.pathname === '/index.html'
          || window.location.pathname === '/index.htm' || window.location.pathname === '/index';
        if (!isHome || document.getElementById('hb-hero')) return;
        // Inject into the post-list column (#recent-posts), not the flex
        // container (#content-inner): making it a flex item breaks the 74%/26% layout.
        var host = document.getElementById('recent-posts');
        if (!host) return;
        var html = '<div class="hb-hero" id="hb-hero">'
          + '<div class="hb-hero-inner">'
          + '<h1 class="hb-hero-title">硬件基础知识库</h1>'
          + '<p class="hb-hero-sub">覆盖硬件设计全流程：需求分析、原理图设计、PCB 设计、调试验证与量产导入；常用器件选型参考；以及 I2C、SPI、UART、USB、PCIe、SATA、HDMI 等主流接口协议。</p>'
          + '</div></div>';
        var catHtml = '<div class="hb-hero-cats" id="hb-cat-grid">'
          + '<span class="hb-cat-eyebrow">分类索引</span>'
          + '<div class="hb-cat-groups"></div>'
          + '</div>';
        host.insertAdjacentHTML('afterbegin', html + catHtml);

        var items = host.querySelectorAll('.recent-post-item');
        items.forEach(function (el) { el.classList.add('hb-index-item'); });
        if (items.length) items[0].classList.add('hb-index-item--lead');

        // ---- 分类索引：按两个合集分组（流程 / 选型），完整索引，仅标题 ----
        var CAT_GRID_LIMIT = 3;
        var COLS = [
          { key: 'hardware-development', name: '硬件开发流程', link: '/collections/hardware-development/',
            prefix: 'hardware-development-' },
          { key: 'component-selection', name: '硬件器件选型', link: '/collections/component-selection/',
            prefix: 'component-selection-' },
          { key: 'hardware-interface-protocol', name: '硬件接口协议', link: '/collections/hardware-interface-protocol/',
            prefix: 'hardware-interface-protocol-' }
        ];
        // 完整索引清单：按合集分组，顺序为稳定的展示顺序（不依赖首页只渲染的 8 篇）
        var INDEX = {
          'hardware-development': [
            { slug: 'hardware-development-process', title: '流程总览' },
            { slug: 'hardware-development-requirements-analysis', title: '需求分析' },
            { slug: 'hardware-development-solution-design', title: '方案设计' },
            { slug: 'hardware-development-schematic-design', title: '原理图设计' },
            { slug: 'hardware-development-pcb-design', title: 'PCB 设计' },
            { slug: 'hardware-development-pcb-fabrication-assembly', title: 'PCB 制造与组装' },
            { slug: 'hardware-development-debugging-validation', title: '调试验证' },
            { slug: 'hardware-development-design-iteration', title: '设计迭代' },
            { slug: 'hardware-development-production-introduction', title: '量产导入' }
          ],
          'component-selection': [
            { slug: 'component-selection-resistor', title: '电阻' },
            { slug: 'component-selection-capacitor', title: '电容' },
            { slug: 'component-selection-inductor', title: '电感' },
            { slug: 'component-selection-bead-transformer', title: '磁珠与变压器' },
            { slug: 'component-selection-fuse', title: '保险丝' },
            { slug: 'component-selection-diode', title: '二极管' },
            { slug: 'component-selection-tvs', title: 'TVS 钳位二极管' },
            { slug: 'component-selection-esd', title: 'ESD 保护器件' },
            { slug: 'component-selection-transistor', title: '三极管' },
            { slug: 'component-selection-mosfet', title: 'MOS 管' },
            { slug: 'component-selection-optocoupler', title: '光耦' },
            { slug: 'component-selection-crystal', title: '晶振' },
            { slug: 'component-selection-ldo', title: 'LDO 稳压器' },
            { slug: 'component-selection-dc-dc', title: 'DC-DC 转换器' },
            { slug: 'component-selection-memory', title: '存储器' },
            { slug: 'component-selection-ddr', title: 'DDR 存储器' },
            { slug: 'component-selection-mcu', title: 'MCU' },
            { slug: 'component-selection-watchdog', title: '看门狗' },
            { slug: 'component-selection-adc', title: 'ADC' },
            { slug: 'component-selection-dac', title: 'DAC' }
          ],
          'hardware-interface-protocol': [
            { slug: 'hardware-interface-protocol-overview', title: '接口协议总览' },
            { slug: 'hardware-interface-protocol-i2c', title: 'I2C 接口' },
            { slug: 'hardware-interface-protocol-spi', title: 'SPI 接口' },
            { slug: 'hardware-interface-protocol-uart', title: 'UART 接口' },
            { slug: 'hardware-interface-protocol-i2s', title: 'I2S 接口' },
            { slug: 'hardware-interface-protocol-sdio', title: 'SDIO 接口' },
            { slug: 'hardware-interface-protocol-jtag-swd', title: 'JTAG-SWD 接口' },
            { slug: 'hardware-interface-protocol-usb', title: 'USB 接口' },
            { slug: 'hardware-interface-protocol-pcie', title: 'PCIe 接口' },
            { slug: 'hardware-interface-protocol-sata', title: 'SATA 接口' },
            { slug: 'hardware-interface-protocol-mipi', title: 'MIPI 接口' },
            { slug: 'hardware-interface-protocol-edp', title: 'eDP 接口' },
            { slug: 'hardware-interface-protocol-hdmi-dp', title: 'HDMI-DP 接口' }
          ]
        };
        var hostEl = document.getElementById('hb-cat-grid');
        var grid = hostEl.querySelector('.hb-cat-groups');
        var posts = host.querySelectorAll('.recent-post-item');
        var visibleCols = COLS.slice(0, CAT_GRID_LIMIT);
        visibleCols.forEach(function (col) {
          var entries = INDEX[col.key] || [];
          var g = document.createElement('div');
          g.className = 'hb-cat-group';
          g.setAttribute('data-cat', col.key);
          var h = '<a class="hb-cat-name" href="' + col.link + '">' + col.name + '</a>';
          h += '<ul class="hb-cat-list">';
          entries.forEach(function (e) {
            var label = e.title;
            h += '<li><a href="/posts/' + e.slug + '/" title="' + label + '">' + label + '</a></li>';
          });
          h += '</ul>';
          g.innerHTML = h;
          grid.appendChild(g);
        });

        // 分类索引已承担索引职责，隐藏下方常规文章列表与分页
        var itemsAll = host.querySelectorAll('.recent-post-item');
        itemsAll.forEach(function (el) { el.style.display = 'none'; });
        var pager = host.querySelector('#pagination');
        if (pager) pager.style.display = 'none';
      });
      </script>

asset:
  main_css: css/index.min.css
