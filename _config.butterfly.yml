# Butterfly 主题配置覆盖
# 未在此处列出的选项由 hexo-theme-butterfly 的默认配置接管。
# 完整配置示例：node_modules/hexo-theme-butterfly/_config.yml

nav:
  logo: /img/favicon.svg
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  选型系列: /collections/component-selection/ || fas fa-layer-group
  流程系列: /collections/hardware-development/ || fas fa-list-check
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

code_blocks:
  theme: light
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fas fa-envelope: mailto:lzp0525@126.com || Email || '#4a7dbe'

favicon: /img/favicon.svg

avatar:
  img: /img/avatar.svg
  effect: false

disable_top_img: true

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover: /img/og-cover.png

error_404:
  enable: true
  subtitle: '页面走丢了'
  background: /img/error-page.png

subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 记录，思考，应用

index_layout: 4

index_post_content:
  method: 1
  length: 180

toc:
  post: true
  number: true
  expand: false
  scroll_percent: true

post_copyright:
  enable: true
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 3

post_pagination: 1

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text:

aside:
  enable: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: '记录，思考，应用。'
    button:
      enable: false
  card_announcement:
    enable: true
    content: '欢迎来到硬件Base，这里记录技术、硬件与长期思考。'
  card_recent_post:
    enable: false
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 12
    color: false
  card_archives:
    enable: false
    type: monthly
    format: 'YYYY年MM月'
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2026/10/01

rightside_scroll_percent: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

math:
  use: mathjax
  per_page: false
  hide_scrollbar: false

search:
  use: local_search
  placeholder: '搜索文章…'
  local_search:
    preload: true
    top_n_per_article: -1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

share:
  use:

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

waline:
  # 接入 Waline 后，在这里填写服务端地址，并把上面的 comments.use 改为 Waline。
  serverURL:
  bg:
  pageview: false
  option:

display_mode: light
text_align_justify: false

font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
  code_font_family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace'

blog_title_font:
  font_link:
  font_family: '"Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif'

preloader:
  enable: false

canvas_ribbon:
  enable: false

theme_color:
  enable: true
  main: '#6F8FBA'
  paginator: '#6F8FBA'
  link_color: '#5478A9'
  hr_color: '#8FA8C8'
  code_foreground: '#B85C6A'
  code_background: 'rgba(111, 143, 186, 0.08)'
  toc_color: '#6F8FBA'
  meta_color: '#7A8493'
  blockquote_padding_color: '#6F8FBA'
  blockquote_background_color: '#6F8FBA'

CDN:
  internal_provider: local
  third_party_provider: local
  option:
    fontawesome: /vendor/fontawesome/css/all.min.css
    mathjax: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js

Open_Graph_meta:
  enable: true
  option:
    image: /img/og-cover.png

inject:
  head:
    # custom.css 已合并进 css/index.min.css（source/css/custom.css 被主题 index.styl @import）,
    # 不再单独请求，避免浏览器多下载 6KB 并覆盖压缩版样式。
  bottom:
    - |
      <script>
      // Homepage-only, idempotent custom content:
      //   hb-hero    - hero card ("硬件基础知识库")
      //   hb-cat-grid - "分类索引" card: top 5 posts per category, titles only
      document.addEventListener('DOMContentLoaded', function () {
        var isHome = window.location.pathname === '/' || window.location.pathname === '/index.html'
          || window.location.pathname === '/index.htm' || window.location.pathname === '/index';
        if (!isHome || document.getElementById('hb-hero')) return;
        // Inject into the post-list column (#recent-posts), not the flex
        // container (#content-inner): making it a flex item breaks the 74%/26% layout.
        var host = document.getElementById('recent-posts');
        if (!host) return;
        var html = '<div class="hb-hero" id="hb-hero">'
          + '<div class="hb-hero-inner">'
          + '<p class="hb-hero-eyebrow">硬件基础知识库</p>'
          + '<h1 class="hb-hero-title">硬件基础知识库</h1>'
          + '<p class="hb-hero-sub">硬件开发流程与器件选型方法：从需求分析到量产导入的 9 篇流程方法，覆盖 21 篇器件选型。</p>'
          + '</div></div>';
        var catHtml = '<div class="hb-hero-cats" id="hb-cat-grid">'
          + '<span class="hb-cat-eyebrow">分类索引</span>'
          + '<div class="hb-cat-groups"></div>'
          + '</div>';
        host.insertAdjacentHTML('afterbegin', html + catHtml);

        var items = host.querySelectorAll('.recent-post-item');
        items.forEach(function (el) { el.classList.add('hb-index-item'); });
        if (items.length) items[0].classList.add('hb-index-item--lead');

        // ---- 分类索引（每分类前 5 篇，仅标题）----
        var CAT_LIMIT = 5;
        var CAT_LINK = { '博客公告': '/categories/blog-post/', '硬件设计': '/categories/hardware-design/', '长期主义': '/categories/longtermism/' };
        var hostEl = document.getElementById('hb-cat-grid');
        var grid = hostEl.querySelector('.hb-cat-groups');
        var seen = 0;
        var posts = host.querySelectorAll('.recent-post-item');
        // 分类链接挂在 .article-meta__categories 类上（而非在 span 里），
        // 用 closest 向上找 .recent-post-item 再取 a 链接。
        function catOf(item) {
          var el = item.querySelector('.article-meta__categories');
          return el || null;
        }
        var byCat = {};
        for (var i = 0; i < posts.length && seen < 20; i++) {
          var catEl = catOf(posts[i]);
          if (!catEl) continue;
          var name = catEl.textContent;
          var url = catEl.getAttribute('href');
          if (!byCat[name]) {
            byCat[name] = { name: name, link: CAT_LINK[name] || url, items: [] };
          }
          byCat[name].items.push(posts[i].querySelector('.article-title'));
          seen++;
        }
        var catNames = [];
        for (var c in byCat) catNames.push(c);
        catNames.forEach(function (n, ci) {
          var g = document.createElement('div');
          g.className = 'hb-cat-group' + (ci === 0 ? '' : ' hb-cat-group--rest');
          g.setAttribute('data-cat', n);
          var c = byCat[n];
          var h = '<a class="hb-cat-name" href="' + c.link + '">' + n + '</a>';
          h += '<ul class="hb-cat-list">';
          c.items.slice(0, CAT_LIMIT).forEach(function (a) {
            if (!a) return;
            h += '<li><a href="' + a.getAttribute('href') + '" title="' + a.textContent + '">' + a.textContent + '</a></li>';
          });
          if (c.items.length > CAT_LIMIT) {
            h += '<li class="hb-cat-more"><a href="' + c.link + '">共 ' + c.items.length + ' 篇 →</a></li>';
          }
          h += '</ul>';
          g.innerHTML = h;
          grid.appendChild(g);
        });
      });
      </script>

asset:
  main_css: css/index.min.css
